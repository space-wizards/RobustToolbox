name: Build All Configurations

on:
  push:
    branches: [master]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            targetOS: Windows
          - runtime: win-arm64
            targetOS: Windows
          - runtime: osx-x64
            targetOS: MacOS
          - runtime: osx-arm64
            targetOS: MacOS
          - runtime: linux-x64
            targetOS: Linux
          - runtime: linux-arm64
            targetOS: Linux
          - runtime: linux-musl-x64
            targetOS: Linux
          - runtime: linux-musl-arm64
            targetOS: Linux
          - runtime: freebsd-x64
            targetOS: FreeBSD
          - runtime: freebsd-arm64
            targetOS: FreeBSD

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore
      - name: Build Debug
        run: dotnet build --no-restore --configuration Debug /p:WarningsAsErrors=nullable /p:TargetOS=${{ matrix.targetOS }} --runtime ${{ matrix.runtime }}
      - name: Build Tools
        run: dotnet build --no-restore --configuration Tools /p:WarningsAsErrors=nullable /p:TargetOS=${{ matrix.targetOS }} --runtime ${{ matrix.runtime }}
      - name: Build Release
        run: dotnet build --no-restore --configuration Release /p:WarningsAsErrors=nullable /p:TargetOS=${{ matrix.targetOS }} --runtime ${{ matrix.runtime }}
